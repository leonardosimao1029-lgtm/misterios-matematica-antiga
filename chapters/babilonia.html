<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Mistérios da Matemática Antiga — Babilônia</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#091921;color:#fff0d1}body{font-family:Georgia,'Times New Roman',serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}button,input,textarea{font:inherit}button{cursor:pointer}#screen{width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(0px,.45vw,10px);background:radial-gradient(ellipse at 50% 25%,#1c4353 0%,#0c1c2a 62%,#03080c 100%)}#stage{width:min(99.4vw,calc(98dvh * 1672 / 941));aspect-ratio:1672 / 941;position:relative;max-width:2000px;overflow:hidden;background:#b79369;box-shadow:0 15px 65px #000b;border:2px solid #b78c50;border-radius:9px;isolation:isolate}#scene{position:absolute;inset:0;object-fit:fill;width:100%;height:100%;user-select:none;pointer-events:none}#hits{position:absolute;inset:0;z-index:2}.hot{position:absolute;transform:translate(-50%,-50%);background:transparent;border:0;display:flex;align-items:center;justify-content:center;outline:0;color:#fff1a7;isolation:isolate}.hot:focus-visible,.ui-target:focus-visible,.small:focus-visible{outline:2px solid #fff4ac;outline-offset:2px}.hot .beacon{position:absolute;width:38px;height:38px;border-radius:100%;display:grid;place-items:center;pointer-events:none;box-shadow:0 0 20px 6px #ffc351bb,0 0 8px #fff1a0,inset 0 0 8px #8e5b21;background:#54390adf;border:2px solid #ffe1a1;font:26px Arial,sans-serif;animation:glimmer 2.7s ease-in-out infinite}.hot:hover:after,.hot:focus-visible:after{content:'';position:absolute;inset:3px;border:2px solid #ffe5a5;border-radius:999px;box-shadow:0 0 12px 5px #dca84d88;background:#ffd06b2a}.hot.found:after{content:'✓';position:absolute;right:-4px;top:-4px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;color:#f4ffec;background:#176c58;border:1px solid #ffd37f;font:800 15px system-ui;box-shadow:0 3px 7px #0009}.hot .beacon.visited{opacity:.32}@keyframes glimmer{0%,100%{box-shadow:0 0 12px #ffca6177,0 0 2px #fff;transform:scale(.9)}50%{box-shadow:0 0 22px #ffc45bcc,0 0 12px #ffd76d;transform:scale(1.08)}}.ui-target{position:absolute;z-index:5;background:transparent;border:1px solid transparent;border-radius:12px}.ui-target:hover{border-color:#ffdb9b;box-shadow:inset 0 0 20px #fff4b71e}#status{position:absolute;right:1.5%;top:2%;z-index:7;border-radius:999px;background:#0e2939e8;border:1px solid #ddbb7b;box-shadow:0 3px 16px #0008;font:600 clamp(10px,1vw,14px) system-ui,sans-serif;color:#fff0cc;padding:8px 13px}#tooltag{position:absolute;top:9%;right:1.5%;z-index:6;background:#0c2d3edb;border:1px solid #bba16c;border-radius:999px;color:#fff4d4;font:500 clamp(10px,.93vw,13px) system-ui,sans-serif;padding:6px 12px}#toast{position:absolute;top:16%;left:50%;transform:translate(-50%,-12px);width:max-content;max-width:80%;font:600 clamp(12px,1.35vw,17px) system-ui,sans-serif;color:#fff4dd;text-align:center;background:#132f3bec;border:1px solid #d9b777;border-radius:13px;padding:12px 20px;z-index:25;box-shadow:0 10px 30px #0009;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}#toast.on{opacity:1;transform:translate(-50%,0)}#veil{position:absolute;inset:0;z-index:20;background:#041421c2;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:14px}#veil.open{display:flex}#panel{position:relative;max-height:95%;overflow-y:auto;width:min(94%,680px);padding:clamp(19px,3vw,35px);background:linear-gradient(160deg,#173a4c 0%,#0b2531 85%);border:2px solid #cb9b53;box-shadow:0 25px 65px #000c,inset 0 0 0 1px #f5dcae41;border-radius:19px}#panel h2{margin:4px 0 15px;font-size:clamp(23px,2.9vw,36px);line-height:1.12;color:#ffe0a0}#panel h3{margin:12px 0 7px;color:#ffe3a8}#panel p{font:400 clamp(13px,1.25vw,16px)/1.6 system-ui,sans-serif;color:#e8edec;margin:9px 0}#panel .eyebrow{color:#bfe4f1;font:800 10px system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase}#panel strong{color:#ffe3a7}#panel .sub{color:#c5d6d9;font-size:13px}#close{position:absolute;right:15px;top:12px;background:#214151;color:#f8e3b7;border:1px solid #d1ac72;border-radius:100%;height:35px;width:35px;font:22px Arial,sans-serif;display:grid;place-items:center}#close:hover{background:#47697a}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.small{background:linear-gradient(#fbdba0,#d19a4b);border:1px solid #ffdca6;color:#32200a;border-radius:9px;padding:11px 16px;font:800 13px system-ui,sans-serif;box-shadow:0 3px 0 #7b561e}.small.secondary{background:linear-gradient(#275471,#143244);color:#f9e8cd;border-color:#c39c67;box-shadow:0 3px 0 #071b24}.small:disabled{opacity:.5;cursor:not-allowed}.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:10px;margin:16px 0}.toolcard{border:1px solid #8b8b73;background:#0a2633;padding:13px;border-radius:10px;color:#fff3dc;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:5px}.toolcard.active{border-color:#f5cd83;background:#234652;box-shadow:0 0 0 2px #f4d59d44}.toolcard span{font:700 16px system-ui}.toolcard small{font:12px/1.4 system-ui;color:#cedcdb}.listnote{border-left:3px solid #d6b169;background:#264354;padding:11px 13px;margin:10px 0;color:#fff1d5;font:14px/1.5 system-ui}.fields{display:grid;gap:11px;margin:15px 0}.field label{display:block;font:600 13px system-ui;margin-bottom:5px}.field .entry{display:flex;align-items:center;gap:10px}.field input,.note,.workinput{border:1px solid #829ba0;border-radius:8px;background:#051e29;color:#fff;padding:11px 12px;min-width:0}.field input{width:min(250px,100%);font-size:17px}.field span{color:#bfe5dd;font:13px system-ui}.note{width:100%;min-height:82px;resize:vertical;font:14px system-ui}.notice{font:13px/1.5 system-ui;color:#e6e2b8;border:1px solid #596b67;padding:9px 11px;border-radius:7px;background:#152e38}.success{background:#1c5342;border:1px solid #66c7a2;border-radius:11px;padding:13px;color:#eaffdc;font:700 15px system-ui}.err{background:#633723;border:1px solid #c17b54;border-radius:10px;padding:10px;color:#ffe6c9;font:600 14px system-ui;margin-top:12px}.steps{margin:14px 0;padding-left:20px;font:14px/1.6 system-ui;color:#e4eeea}.steps li{margin:5px 0}.workvisual{display:flex;align-items:center;gap:15px;justify-content:center;padding:13px;border-radius:10px;background:#09212c;border:1px solid #547584;margin:13px 0;flex-wrap:wrap}.workblock{width:130px;height:80px;background:#c5965b;border:2px solid #edcf92;display:grid;place-items:center;color:#102634;font:bold 16px system-ui;border-radius:3px}.plus{font:800 27px system-ui;color:#e4c58b}.worksquare{width:80px;height:80px;background:#4c917d;border:2px dashed #a4d9ce;display:grid;place-items:center;color:#fff;font:700 17px system-ui}.aimrow{display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:center;margin:14px 0}.dial{width:175px;height:175px;border:5px solid #c8a267;border-radius:50%;background:radial-gradient(circle,#355568,#102536);position:relative;overflow:hidden;box-shadow:inset 0 0 23px #0008}.dial:after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:#eac789;transform:translate(-50%,-50%);z-index:3}.needle,.target{position:absolute;bottom:50%;left:calc(50% - 2px);width:4px;height:42%;transform-origin:center bottom;border-radius:5px}.needle{background:#9ae2fc;transform:rotate(0deg);box-shadow:0 0 8px #89e8ff;z-index:2}.target{background:#ffc76b;transform:rotate(45deg);opacity:.76}.aimcontrols{flex:1;min-width:210px;font:14px system-ui}.aimcontrols input[type=range]{width:100%;accent-color:#e7af61}.focusline{text-align:center;font-size:13px;color:#c8dfdf;margin-top:8px}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti b{position:absolute;top:-10%;left:var(--x);height:12px;width:7px;background:var(--c);opacity:0;animation:fall 2.1s ease-in var(--delay) forwards}@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(680deg)}}@media(max-width:700px){#panel{width:96%;padding:18px;border-radius:12px}#status{padding:5px 8px}#tooltag{display:none}.hot .beacon{height:20px;width:20px;font:14px Arial}.hot.found:after{width:15px;height:15px;font:11px system-ui}#toast{padding:6px 10px}.small{padding:8px 10px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}</style></head><body><div id="screen"><main id="stage" aria-label="Mistérios da Matemática Antiga"><img id="scene" alt="Cenário histórico ilustrado da missão"><div id="hits"></div><div id="status">Missão 1/2 · 0/4 pistas</div><div id="tooltag">🧰 Abra a mochila</div><div id="toast" role="status" aria-live="polite"></div><div id="buttons"></div><div id="veil" class="open"><section id="panel" role="dialog" aria-modal="true"><button id="close" aria-label="Fechar janela" style="display:none">×</button><div id="modal"></div></section></div></main></div><script>const GAME={"slug":"babilonia","title":"Babilônia","chapter":"As terras da Mesopotâmia","emblem":"𒀭","color":"#317d9a","intro":"Os registros dos agrimensores precisam ser recuperados. Investigue os campos e as tabuletas para restaurar as medidas das terras babilônicas.","history":"Atividade inspirada em práticas matemáticas mesopotâmicas, com medidas apresentadas em metros e metros quadrados.","tools":[{"id":"lupa","label":"Lupa","icon":"🔎","desc":"Investiga inscrições, registros e objetos sem alterar suas medidas."},{"id":"corda","label":"Corda","icon":"🪢","desc":"Mede distâncias nas terras e ao longo das cercas."},{"id":"estacas","label":"Estacas","icon":"📍","desc":"Identifica limites e distâncias entre lados de terrenos."},{"id":"pecas","label":"Peças","icon":"🧱","desc":"Explora formas geométricas e ajuda a completar quadrados."}],"missions":[{"title":"Os campos agrícolas","image":"/assets/scenes/babilonia_1.webp","goal":"Descubra a área total dos terrenos e quanto falta para atingir 100 m².","context":"Um agricultor possui dois campos: um retangular e outro trapezoidal. Os registros das dimensões estão dispersos pela propriedade. Recupere as medidas e registre o total em m².","hints":["A propriedade contém duas figuras diferentes: retângulo e trapézio. Calcule as áreas separadamente.","No trapézio, calcule a média das bases paralelas e multiplique pela distância entre elas.","A meta é alcançar 100 m². Calcule as duas áreas e descubra quanto falta."],"required":["a","b","c","unit"],"hotspots":[{"id":"a","x":28,"y":54,"w":5,"h":9,"label":"Campo retangular","requiredTool":"corda","clue":"Parte A: retângulo de 8 m × 6 m.","probe":"Os canteiros da esquerda formam um retângulo. Use a corda para conferir seus lados.","wrong":"Para medir os lados do campo, experimente a corda.","visible":true},{"id":"b","x":57,"y":54,"w":5,"h":9,"label":"Campo trapezoidal","requiredTool":"corda","clue":"Parte B: bases paralelas de 6 e 10 m.","probe":"O terreno da direita possui duas bordas paralelas de tamanhos diferentes.","wrong":"Use a corda para medir as bases do trapézio.","visible":true},{"id":"c","x":65,"y":66,"w":5,"h":9,"label":"Estacas da divisa","requiredTool":"estacas","clue":"Distância entre as bases do trapézio: 6 m.","probe":"As estacas ajudam a identificar a distância perpendicular entre os lados paralelos.","wrong":"As estacas servem para marcar limites e conferir a distância entre as bases.","visible":true},{"id":"unit","x":81,"y":70,"w":5,"h":9,"label":"Tabuleta do escriba","requiredTool":"lupa","clue":"Um metro quadrado é a área de um quadrado com lado de 1 metro. A meta dos agricultores é 100 m².","probe":"A tabuleta apresenta registros de medição, adaptados às unidades atuais para esta atividade.","wrong":"Examine os sinais da tabuleta com a lupa.","visible":true}],"fields":[{"name":"total","label":"Área total dos dois campos","unit":"m²","expected":96},{"name":"missing","label":"Quanto falta para atingir 100 m²","unit":"m²","expected":4}],"solution":["Retângulo: 8 × 6 = 48 m².","Trapézio: (6 + 10) ÷ 2 × 6 = 48 m².","Área total = 96 m²; faltam 100 − 96 = 4 m² para 100 m²."],"after":"A área das plantações foi registrada corretamente!"},{"title":"O enigma das terras","image":"/assets/scenes/babilonia_2.webp","goal":"Recupere o comprimento e a largura que desapareceram da tabuleta.","context":"Um escriba possui um registro de área, mas as dimensões desapareceram. Interprete a diferença entre os lados e reconstrua o terreno com um procedimento geométrico.","hints":["Comece chamando a largura de x. O comprimento é x + 4 e a área é 96.","Pegue metade da diferença 4: são 2 m. Um quadrado de lado 2 possui área 4 m².","Complete o quadrado: 96 + 4 = 100 = 10². As dimensões são 10 − 2 e 10 + 2."],"required":["area","diff","workshop"],"hotspots":[{"id":"area","x":22.5,"y":54.5,"w":5,"h":9,"label":"Tabuleta de argila","requiredTool":"lupa","clue":"Registro da tabuleta: área do terreno = 96 m².","probe":"Há uma informação numérica gravada na argila.","wrong":"A lupa permite examinar melhor os registros da tabuleta."},{"id":"diff","x":48.5,"y":40.6,"w":5,"h":9,"label":"Limites do terreno","requiredTool":"estacas","clue":"O comprimento é 4 m maior do que a largura.","probe":"As estacas indicam que os lados do campo não têm o mesmo comprimento.","wrong":"Use as estacas para identificar a diferença entre os lados."},{"id":"workshop","x":49,"y":76,"w":5,"h":9,"label":"Peças geométricas","requiredTool":"pecas","clue":"Quadrado completado: 96 + 4 = 100 m²; lado do quadrado = 10 m.","probe":"Estas peças permitem completar a figura para formar um quadrado perfeito.","wrong":"Selecione Peças na mochila para reconstruir a figura.","special":"workshop"}],"fields":[{"name":"width","label":"Largura do terreno","unit":"m","expected":8},{"name":"length","label":"Comprimento do terreno","unit":"m","expected":12}],"solution":["Metade da diferença: 4 ÷ 2 = 2 m.","Completando o quadrado: 96 + 2² = 100; lado do quadrado = 10.","Largura = 10 − 2 = 8 m; comprimento = 10 + 2 = 12 m."],"after":"O registro da terra foi reconstruído!"}]};
(()=>{'use strict';
const $=s=>document.querySelector(s), stage=$('#stage'),img=$('#scene'),hitRoot=$('#hits'),buttonRoot=$('#buttons'),veil=$('#veil'),modal=$('#modal'),close=$('#close'),status=$('#status'),tooltag=$('#tooltag'),toast=$('#toast');
const KEY='mma_v4_'+GAME.slug;
let index=0, selected='lupa', found=[new Set(),new Set()], notes=['',''],hintCount=[0,0],startShown=true,finishShown=false,toastTimer=null;
const mission=()=>GAME.missions[index];
function infoTool(id){return GAME.tools.find(x=>x.id===id)}
function msg(t){toast.textContent=t;toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('on'),3900)}
function safe(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function store(){try{localStorage.setItem(KEY,JSON.stringify({index, found:found.map(s=>[...s]), notes, hintCount}))}catch(e){}}
function fresh(){index=0;found=[new Set(),new Set()];notes=['',''];hintCount=[0,0];selected='lupa';store()}
function show(markup,hideClose=false){modal.innerHTML=markup;veil.classList.add('open');close.style.display=hideClose?'none':'grid';const first=modal.querySelector('input:not([type=range]),.small');if(first)first.focus({preventScroll:true})}
function hide(){veil.classList.remove('open');document.activeElement?.blur?.()}
close.addEventListener('click',hide);
veil.addEventListener('click',e=>{if(e.target===veil && close.style.display!=='none')hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && close.style.display!=='none')hide()});
function placeButton(x,y,w,h,text,onClick){let b=document.createElement('button');b.className='ui-target';b.setAttribute('aria-label',text);b.title=text;Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.addEventListener('click',onClick);buttonRoot.appendChild(b);}
function render(){img.src=mission().image;hitRoot.innerHTML='';buttonRoot.innerHTML='';mission().hotspots.forEach(h=>{let b=document.createElement('button');b.className='hot'+(found[index].has(h.id)?' found':'');b.setAttribute('aria-label','Investigar: '+h.label);b.title=h.label;Object.assign(b.style,{left:h.x+'%',top:h.y+'%',width:(h.w||5)+'%',height:(h.h||9)+'%'});if(h.visible || (GAME.slug==='grecia' && index===1 && h.id==='stand')){let v=document.createElement('span');v.className='beacon'+(found[index].has(h.id)?' visited':'');v.textContent='⌕';b.appendChild(v)}b.addEventListener('click',()=>investigate(h));hitRoot.appendChild(b)});
 const btns=[{x:49.7,y:93.1,w:11.3,h:6.5,label:'Abrir mochila',fn:bag},{x:80.8,y:93.1,w:10.7,h:6.5,label:'Abrir diário',fn:diary},{x:92.1,y:93.1,w:12,h:6.5,label:'Responder',fn:answer}];
 btns.forEach(b=>placeButton(b.x-b.w/2,b.y-b.h/2,b.w,b.h,b.label,b.fn));
 status.textContent='Missão '+(index+1)+'/2 · '+mission().required.filter(x=>found[index].has(x)).length+'/'+mission().required.length+' pistas';tooltag.textContent='Ferramenta: '+infoTool(selected).icon+' '+infoTool(selected).label;}
function intro(){show('<div class="eyebrow">CAPÍTULO '+safe(GAME.title.toUpperCase())+' · CAPÍTULO INTERATIVO</div><h2>Mistérios da Matemática Antiga</h2><h3>'+safe(GAME.chapter)+'</h3><p>'+safe(GAME.intro)+'</p><div class="listnote">Explore com a <strong>lupa</strong>, escolha instrumentos na <strong>mochila</strong>, guarde medidas no <strong>diário</strong> e só depois responda. São duas missões em sequência.</div><p class="sub">'+safe(GAME.history)+'</p><div class="actions"><button class="small" id="start">▶ Iniciar investigação</button><button class="small secondary" id="reset">↺ Recomeçar do início</button></div>',true);$('#start').onclick=()=>{hide();render();msg('Explore os pontos do cenário e escolha suas ferramentas na mochila.');};$('#reset').onclick=()=>{fresh();render();hide();msg('Percurso reiniciado. Boa investigação!')};}
function bag(){const cards=GAME.tools.map(t=>'<button class="toolcard '+(selected===t.id?'active':'')+'" data-tool="'+t.id+'"><span>'+t.icon+' '+safe(t.label)+(selected===t.id?' ✓':'')+'</span><small>'+safe(t.desc)+'</small></button>').join('');show('<div class="eyebrow">EQUIPAMENTOS DO AGRIMENSOR</div><h2>🎒 Mochila</h2><p>Selecione um instrumento e depois clique nos elementos do cenário. Nem todos os instrumentos funcionam em todos os lugares.</p><div class="tool-grid">'+cards+'</div><div class="actions"><button class="small secondary" id="bagclose">Voltar ao cenário</button></div>');modal.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{selected=b.dataset.tool;hide();render();msg(infoTool(selected).icon+' '+infoTool(selected).label+' selecionada(o). Clique em um ponto da imagem.');});$('#bagclose').onclick=hide;}
function saveNote(){let el=$('#notes');if(el){notes[index]=el.value;store()}}
function diary(){let entries=mission().hotspots.filter(h=>found[index].has(h.id)).map(h=>'<div class="listnote"><strong>'+safe(h.label)+'</strong><div>'+safe(h.clue)+'</div></div>').join('');show('<div class="eyebrow">REGISTROS DA EQUIPE</div><h2>📖 Diário de investigação</h2><p>'+safe(mission().title)+'</p>'+(entries||'<p class="notice">Nenhuma medida registrada ainda. Investigue o cenário.</p>')+'<h3>Anotações</h3><textarea class="note" id="notes" placeholder="Registre aqui a estratégia e os cálculos...">'+safe(notes[index])+'</textarea><div class="actions"><button class="small" id="back">Continuar investigando</button></div>');$('#notes').addEventListener('input',saveNote);$('#back').onclick=()=>{saveNote();hide()};}
function investigate(h){if(found[index].has(h.id)){msg('Já registrado no diário: '+h.clue);return}
 if(selected==='lupa' && h.requiredTool!=='lupa'){show('<div class="eyebrow">OBSERVAÇÃO</div><h2>🔎 '+safe(h.label)+'</h2><p>'+safe(h.probe)+'</p><div class="actions"><button class="small" id="okay">Entendi</button><button class="small secondary" id="openBag">Abrir mochila</button></div>');$('#okay').onclick=hide;$('#openBag').onclick=bag;return;}
 if(selected!==h.requiredTool){msg(h.wrong);return}
 if(h.special==='workshop'){if(!found[index].has('area')||!found[index].has('diff')){msg('Primeiro descubra a área na tabuleta e a diferença entre os lados do terreno.');return}workshop();return}
 if(h.special==='aim'){aim();return}
 record(h)}
function record(h){found[index].add(h.id);store();render();show('<div class="eyebrow">PISTA DESCOBERTA</div><h2>✦ '+safe(h.label)+'</h2><div class="success">'+safe(h.clue)+'</div><p>Esta informação foi salva no diário.</p><div class="actions"><button class="small" id="continue">Continuar explorando</button><button class="small secondary" id="diarybtn">Ver diário</button></div>');$('#continue').onclick=()=>{hide();if(ready())msg('Todas as pistas principais encontradas! Abra Responder.')};$('#diarybtn').onclick=diary;}
function ready(){return mission().required.every(x=>found[index].has(x))}
function answer(){if(!ready()){let missing=mission().required.filter(id=>!found[index].has(id)).length;show('<div class="eyebrow">INVESTIGAÇÃO INCOMPLETA</div><h2>🔐 Ainda faltam '+missing+' pista(s)</h2><p>As medidas necessárias precisam ser encontradas com os instrumentos do cenário antes de responder.</p><div class="actions"><button class="small" id="resume">Voltar ao cenário</button><button class="small secondary" id="bag">Mochila</button></div>');$('#resume').onclick=hide;$('#bag').onclick=bag;return}
 let fields=mission().fields.map(f=>'<div class="field"><label for="f_'+f.name+'">'+safe(f.label)+'</label><div class="entry"><input id="f_'+f.name+'" type="text" inputmode="decimal" autocomplete="off" placeholder="Sua resposta"><span>'+safe(f.unit)+'</span></div></div>').join('');show('<div class="eyebrow">RESOLVER MISSÃO '+(index+1)+'</div><h2>✍ '+safe(mission().title)+'</h2><p>'+safe(mission().goal)+'</p><div class="fields">'+fields+'</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="small" id="verify">Conferir resposta</button><button class="small secondary" id="seeDiary">Ver diário</button></div>');$('#verify').onclick=verify;$('#seeDiary').onclick=diary;modal.querySelectorAll('input').forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter')verify()}));}
function parseN(v){return Number(v.trim().replace(',','.').replace(/\s+/g,''));}
function verify(){const all=mission().fields;const vals=all.map(f=>$('#f_'+f.name).value);const passed=all.every((f,i)=>vals[i].trim()!=='' && Number.isFinite(parseN(vals[i])) && Math.abs(parseN(vals[i])-f.expected)<.001);if(passed){victory();return};$('#feedback').innerHTML='<div class="err">Ainda não. Revise os registros no diário e seu cálculo. Você pode tentar novamente sem perder as pistas.</div>';hintCount[index]=Math.max(1,hintCount[index]);store();}
function victory(){window.parent.postMessage({type:'mma:mission-complete',chapter:'babilonia',mission:index},'*');let solution=mission().solution.map(t=>'<li>'+safe(t)+'</li>').join('');show('<div class="eyebrow">MISSÃO '+(index+1)+' CONCLUÍDA</div><h2>🏆 '+safe(mission().after)+'</h2><div class="success">As respostas estão corretas!</div><h3>Uma possível resolução</h3><ol class="steps">'+solution+'</ol><div class="actions"><button class="small" id="next">'+(index===0?'Ir para a Missão 2 →':'Concluir capítulo ✨')+'</button><button class="small secondary" id="review">Ver diário</button></div>',true);$('#next').onclick=()=>{if(window.MMA_MULTI_LOCK){msg('Aguarde a liberação do professor.');return;}if(index===0){index=1;selected='lupa';store();render();hide();msg('Missão 2 iniciada! Investigue o novo cenário.')}else{finish();}};$('#review').onclick=diary;}
function finish(){let outputs=GAME.missions.map((m,i)=>'<div class="listnote"><strong>Missão '+(i+1)+': '+safe(m.title)+'</strong><div>'+safe(m.after)+'</div></div>').join('');show('<div class="eyebrow">CAPÍTULO CONCLUÍDO</div><h2>✨ '+safe(GAME.title)+' restaurada!</h2><p>Você resolveu as duas missões, interpretou as pistas e recuperou parte da harmonia do mundo antigo.</p>'+outputs+'<p class="sub">'+safe(GAME.history)+'</p><div class="actions"><button class="small" id="advance">Seguir para Grécia →</button><button class="small secondary" id="again">Recomeçar capítulo</button><button class="small secondary" id="stay">Ver último cenário</button></div>',true);$('#advance').onclick=()=>msg('Etapa finalizada. Aguarde as demais equipes.');$('#again').onclick=()=>{fresh();render();intro()};$('#stay').onclick=()=>{hide();msg('As duas missões foram concluídas!')};}
function hint(){let h=mission().hints;let at=Math.min(hintCount[index],h.length-1);show('<div class="eyebrow">AJUDA GRADUAL</div><h2>💡 Dica '+(at+1)+' de '+h.length+'</h2><p>'+safe(h[at])+'</p><p class="sub">A dica orienta o raciocínio, mas você ainda precisa investigar e calcular.</p><div class="actions"><button class="small" id="okay">Voltar</button><button class="small secondary" id="more">Próxima dica</button></div>');hintCount[index]=Math.min(h.length-1,hintCount[index]+1);store();$('#okay').onclick=hide;$('#more').onclick=hint;}
function workshop(){show('<div class="eyebrow">OFICINA GEOMÉTRICA · BABILÔNIA</div><h2>🧱 Complete o quadrado</h2><p>O campo tem 96 m² e um lado excede o outro em 4 m. Vamos reorganizar a diferença para construir um quadrado maior.</p><div class="workvisual"><div class="workblock">96 m²</div><div class="plus">+</div><div class="worksquare">? m²</div></div><div class="fields"><div class="field"><label>Metade da diferença de 4 m</label><div class="entry"><input id="half" inputmode="decimal" placeholder="?" autocomplete="off"><span>m</span></div></div><div class="field"><label>Área do pequeno quadrado acrescentado</label><div class="entry"><input id="sq" inputmode="decimal" placeholder="?" autocomplete="off"><span>m²</span></div></div></div><div id="feedback"></div><div class="actions"><button class="small" id="checkwork">Montar quadrado</button><button class="small secondary" id="back">Voltar</button></div>');$('#checkwork').onclick=()=>{if(parseN($('#half').value)===2&&parseN($('#sq').value)===4){record(mission().hotspots.find(x=>x.id==='workshop'))}else $('#feedback').innerHTML='<div class="err">Pense: metade de 4 é o lado de um pequeno quadrado. Qual é a área desse quadrado?</div>'};$('#back').onclick=hide;}
function aim(){show('<div class="eyebrow">DIOPTRIA · OBSERVAÇÃO VIRTUAL</div><h2>📐 Alinhe a mira</h2><p>Arraste a mira azul até coincidir com a marca dourada, que indica a linha de observação até o topo da torre. Depois registre o ângulo.</p><div class="aimrow"><div class="dial"><div class="target"></div><div class="needle" id="needle"></div></div><div class="aimcontrols"><label for="angleRange">Inclinação da mira: <strong id="angleLabel">10°</strong></label><input id="angleRange" type="range" min="0" max="90" value="10" step="1"><div class="focusline" id="alignment">Mova a mira em direção à referência dourada.</div></div></div><div id="feedback"></div><div class="actions"><button class="small" id="aimcheck">Medir ângulo</button><button class="small secondary" id="cancel">Voltar</button></div>');let slider=$('#angleRange');slider.oninput=()=>{let v=Number(slider.value);$('#angleLabel').textContent=v+'°';$('#needle').style.transform='rotate('+v+'deg)';$('#alignment').textContent=Math.abs(v-45)<=2?'As duas linhas estão alinhadas!':'Ajuste até as duas linhas coincidirem.'};$('#aimcheck').onclick=()=>{if(Math.abs(Number(slider.value)-45)<=2){record(mission().hotspots.find(x=>x.id==='angle'))}else{$('#feedback').innerHTML='<div class="err">A visada ainda não coincide com a referência. Tente alinhar as duas linhas.</div>'}};$('#cancel').onclick=hide;}
function addFloatingControls(){let hb=document.createElement('button');hb.textContent='? Dicas';hb.style.cssText='position:absolute;top:14%;right:1.5%;z-index:6;border:1px solid #bb9758;border-radius:20px;color:#ffe8b5;background:#123549dc;padding:6px 11px;font:600 clamp(10px,.9vw,12px) system-ui;cursor:pointer';hb.onclick=hint;stage.appendChild(hb);let fb=document.createElement('button');fb.textContent='⛶';fb.title='Tela cheia';fb.setAttribute('aria-label','Tela cheia');fb.style.cssText='position:absolute;top:1.5%;left:1.3%;z-index:6;border:1px solid #b5a080;border-radius:14px;color:#ffe4a6;background:#0e2c3bcd;padding:5px 9px;cursor:pointer';fb.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else stage.requestFullscreen?.()};stage.appendChild(fb);}
// Load every visit fresh so classroom tests never jump into an old mission.
try{let prior=JSON.parse(localStorage.getItem(KEY)||'null');if(prior&&(prior.index===0||prior.index===1)&&Array.isArray(prior.found)&&prior.found.length===2){index=prior.index;found=prior.found.map(s=>new Set(s));notes=Array.isArray(prior.notes)?prior.notes:['',''];hintCount=Array.isArray(prior.hintCount)?prior.hintCount:[0,0]}else fresh()}catch(e){fresh()}render();addFloatingControls();intro();

window.MMA_MULTI_LOCK=true;
window.addEventListener('message',function(ev){
 if(ev.origin!==location.origin||!ev.data||ev.data.type!=='mma:sync-mission')return;
 const n=Number(ev.data.mission);if(n!==0&&n!==1)return;
 if(index!==n){index=n;selected='lupa';store();render();hide();msg('Missão '+(n+1)+' liberada. Explore o novo cenário.');}
 else if(document.getElementById('veil').classList.contains('open')){hide();}
});

})();</script></body></html>
